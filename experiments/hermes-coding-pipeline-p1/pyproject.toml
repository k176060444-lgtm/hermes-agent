[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-coding-pipeline-p1"
version = "0.1.0"
description = "Fail-closed orchestration kernel for Hermes coding pipeline phases 0.2 to Gate 5.9"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
p1-pipeline = "p1.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["p1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
